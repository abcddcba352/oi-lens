name: Daily NSE OI Update

on:
  schedule:
    # 10:45 UTC is 16:15 IST (Mon-Fri)
    - cron: '45 10 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-d1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build to generate configuration
        run: npm run build

      - name: Fetch NSE Data and Upload to Cloudflare D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run update:nse-oi
