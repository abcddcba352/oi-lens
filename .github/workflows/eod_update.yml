name: Automated EOD NSE Data Update

on:
  schedule:
    # 13:15 UTC = 18:45 IST (Monday to Friday)
    - cron: '15 13 * * 1-5'
  workflow_dispatch:

concurrency:
  group: eod-nse-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-data:
    name: Ingest EOD Bhavcopy & Update D1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Test NSE evidence parsers
        run: python -m unittest discover -s tests -p test_nse_evidence.py

      - name: Download NSE EOD data & generate idempotent SQL
        run: |
          python scripts/backfill_history.py --symbols ALL --days 3 --output nse_oi_update.sql

      - name: Apply SQL update to Cloudflare D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a94632b49cf1306aa32d0361f75d4991
        run: |
          npx wrangler d1 execute site-creator-d1 --config wrangler.d1.json --remote --file nse_oi_update.sql -y
