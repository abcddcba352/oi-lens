name: Deploy OI-Lens to Cloudflare

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build application (vinext)
        run: npm run build

      - name: Verify and deduplicate Wrangler configuration
        run: |
          node -e '
            const fs = require("fs");
            const configPath = "dist/server/wrangler.json";
            if (fs.existsSync(configPath)) {
              const cfg = JSON.parse(fs.readFileSync(configPath, "utf8"));
              if (Array.isArray(cfg.d1_databases)) {
                const seen = new Set();
                const before = cfg.d1_databases.length;
                cfg.d1_databases = cfg.d1_databases.filter(item => {
                  if (seen.has(item.binding)) return false;
                  seen.add(item.binding);
                  return true;
                });
                console.log(`D1 bindings: cleaned from ${before} to ${cfg.d1_databases.length} unique binding(s)`);
              }
              fs.writeFileSync(configPath, JSON.stringify(cfg, null, 2));
            }
          '

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a94632b49cf1306aa32d0361f75d4991
        run: npx wrangler deploy --config dist/server/wrangler.json
